<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUEO Wireless - Shared Document Portal</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for professional iconography -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pueo: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Header Section -->
    <header class="bg-gradient-to-r from-pueo-900 via-pueo-800 to-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-sky-500 p-2.5 rounded-lg shadow-inner">
                    <i class="fa-solid fa-wifi text-2xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-wider uppercase">PUEO Wireless</h1>
                    <p class="text-xs text-sky-200">Centralized Document & Link Repository</p>
                </div>
            </div>

            <div>
                <button onclick="toggleSubmitPanel()" class="bg-sky-600 hover:bg-sky-500 text-white px-5 py-2.5 rounded-lg text-sm font-semibold transition-all shadow-md flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Submit Document or Link
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- SUBMIT PANEL (Hidden by Default) -->
        <section id="submitPanel" class="hidden bg-white border border-sky-100 rounded-2xl shadow-lg p-6 mb-8 transition-all">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                <h2 class="text-lg font-bold text-pueo-900 flex items-center gap-2">
                    <i class="fa-solid fa-circle-plus text-sky-600"></i> Add New Document to Portal
                </h2>
                <button onclick="toggleSubmitPanel()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Document Submission Form -->
            <form id="docForm" onsubmit="addDocument(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2 bg-slate-50 p-3 rounded-lg border border-slate-100 mb-2">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Document Delivery Method</label>
                    <div class="flex gap-6">
                        <label class="inline-flex items-center cursor-pointer">
                            <input type="radio" name="docType" value="link" checked onchange="toggleInputFields()" class="text-pueo-600 focus:ring-pueo-500 h-4 w-4">
                            <span class="ml-2 text-sm text-slate-700 font-medium">External Hyperlink</span>
                        </label>
                        <label class="inline-flex items-center cursor-pointer">
                            <input type="radio" name="docType" value="pdf" onchange="toggleInputFields()" class="text-pueo-600 focus:ring-pueo-500 h-4 w-4">
                            <span class="ml-2 text-sm text-slate-700 font-medium">Direct PDF Upload (Downloadable)</span>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Document Title</label>
                    <input type="text" id="docTitle" required placeholder="e.g., Q3 Network Status" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Category Tab</label>
                    <select id="docCategory" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm">
                        <option value="In processing">In processing</option>
                        <option value="MPA">MPA</option>
                        <option value="LES">LES</option>
                        <option value="operations">operations</option>
                    </select>
                </div>

                <!-- Toggleable Source Input -->
                <div id="urlInputContainer" class="md:col-span-2">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Hyperlink / URL</label>
                    <input type="url" id="docUrl" placeholder="https://example.com/your-doc-link" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm">
                </div>

                <div id="pdfInputContainer" class="md:col-span-2 hidden">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Upload PDF File (Saves directly to portal - Max 3MB)</label>
                    <input type="file" id="docFile" accept=".pdf" class="w-full px-3 py-1.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100">
                </div>

                <div class="md:col-span-2">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Short Description</label>
                    <input type="text" id="docDesc" placeholder="Brief details about this document..." class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm">
                </div>

                <div class="md:col-span-2 flex justify-end gap-3 mt-2">
                    <button type="button" onclick="clearForm()" class="px-4 py-2 border border-slate-200 text-slate-500 rounded-lg hover:bg-slate-50 transition text-sm font-medium">Clear Form</button>
                    <button type="submit" class="px-5 py-2 bg-pueo-700 hover:bg-pueo-800 text-white rounded-lg transition text-sm font-semibold shadow-sm">Add to Website</button>
                </div>
            </form>
        </section>

        <!-- Search and Categorization Filters -->
        <section class="mb-8 flex flex-col lg:flex-row justify-between items-center gap-4">
            <!-- Dynamic Category Filter Pills -->
            <div class="flex flex-wrap gap-2 w-full lg:w-auto overflow-x-auto pb-1" id="filterContainer">
                <button onclick="filterCategory('All')" id="btn-All" class="filter-btn active bg-pueo-700 text-white px-4 py-2 rounded-full text-xs font-bold transition-all shadow-sm shrink-0">
                    All Documents
                </button>
                <button onclick="filterCategory('In processing')" id="btn-In-processing" class="filter-btn bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 px-4 py-2 rounded-full text-xs font-bold transition-all shrink-0">
                    In processing
                </button>
                <button onclick="filterCategory('MPA')" id="btn-MPA" class="filter-btn bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 px-4 py-2 rounded-full text-xs font-bold transition-all shrink-0">
                    MPA
                </button>
                <button onclick="filterCategory('LES')" id="btn-LES" class="filter-btn bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 px-4 py-2 rounded-full text-xs font-bold transition-all shrink-0">
                    LES
                </button>
                <button onclick="filterCategory('operations')" id="btn-operations" class="filter-btn bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 px-4 py-2 rounded-full text-xs font-bold transition-all shrink-0">
                    operations
                </button>
            </div>

            <!-- Search Bar -->
            <div class="relative w-full lg:w-80">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="searchInput" oninput="searchDocuments()" placeholder="Search active documents..." class="w-full pl-9 pr-4 py-2.5 border border-slate-200 rounded-full focus:outline-none focus:ring-2 focus:ring-sky-500 bg-white text-sm shadow-inner">
            </div>
        </section>

        <!-- Dynamic Documents Grid -->
        <section>
            <div id="documentsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Javascript renders dynamic elements here -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden text-center py-16 bg-white border border-dashed border-slate-200 rounded-2xl">
                <i class="fa-regular fa-folder-open text-5xl text-slate-300 mb-3"></i>
                <h3 class="text-lg font-bold text-slate-600">No documents uploaded yet</h3>
                <p class="text-slate-400 text-sm mt-1">Use the "Submit Document" panel above to upload the first resource.</p>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 text-xs mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <p>&copy; <span id="currentYear"></span> PUEO Wireless. All rights reserved.</p>
            <div class="flex gap-4">
                <button onclick="clearAllDocuments()" class="text-rose-400 hover:text-rose-300 transition font-semibold">
                    <i class="fa-solid fa-trash-can"></i> Clear All Documents
                </button>
            </div>
        </div>
    </footer>

    <!-- App JavaScript Logic -->
    <script>
        // Unique global bucket key for PUEO Wireless
        const dbUrl = "https://kvdb.io/H8jK2sP9wQ5e3R2t1Y6u/pueo_wireless_global_repo_clean";

        let currentFilter = 'All';
        let documents = [];

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('currentYear').innerText = new Date().getFullYear();
            loadSharedDatabase();
        });

        // Pull documents from the global cloud space
        async function loadSharedDatabase() {
            try {
                const res = await fetch(dbUrl);
                if (!res.ok) {
                    if (res.status === 404) {
                        // DB is completely clean, initialize with empty structure
                        documents = [];
                        await saveToCloud(documents);
                        return;
                    }
                    throw new Error("Cloud fetch failed");
                }

                const data = await res.json();
                if (data && Array.isArray(data)) {
                    documents = data;
                } else {
                    documents = [];
                }
                renderDocuments();
            } catch (err) {
                console.warn("Using offline localStorage fallback...", err);
                const localDocs = localStorage.getItem('pueo_local_docs');
                if (localDocs) {
                    documents = JSON.parse(localDocs);
                } else {
                    documents = [];
                }
                renderDocuments();
            }
        }

        // Add document to list and sync with cloud
        async function addDocument(e) {
            e.preventDefault();
            const title = document.getElementById('docTitle').value.trim();
            const category = document.getElementById('docCategory').value;
            const desc = document.getElementById('docDesc').value.trim();
            const addedOn = new Date().toISOString().split('T')[0];
            const type = document.querySelector('input[name="docType"]:checked').value;
            const id = "doc_" + Date.now() + "_" + Math.random().toString(36).substring(2, 5);

            const newDoc = { id, title, category, desc, addedOn, type };

            if (type === 'pdf') {
                const fileInput = document.getElementById('docFile');
                if (fileInput.files.length === 0) {
                    alert("Please choose a PDF document!");
                    return;
                }
                const file = fileInput.files[0];
                if (file.size > 3 * 1024 * 1024) {
                    alert("PDF files should be less than 3MB for optimal system speed.");
                    return;
                }
                const reader = new FileReader();
                reader.onload = async function(event) {
                    newDoc.pdfData = event.target.result.split(',')[1];
                    documents.unshift(newDoc);
                    await saveToCloud(documents);
                    clearForm();
                    toggleSubmitPanel();
                };
                reader.readAsDataURL(file);
            } else {
                newDoc.url = document.getElementById('docUrl').value.trim();
                documents.unshift(newDoc);
                await saveToCloud(documents);
                clearForm();
                toggleSubmitPanel();
            }
        }

        // Push data to cloud so other users see updates instantly on load/refresh
        async function saveToCloud(docsList) {
            localStorage.setItem('pueo_local_docs', JSON.stringify(docsList));
            renderDocuments();

            try {
                await fetch(dbUrl, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(docsList)
                });
            } catch (err) {
                console.error("Cloud push failed. Saved locally in current browser.", err);
            }
        }

        async function deleteDocument(id) {
            if (confirm('Are you sure you want to delete this document? This removes it permanently for everyone.')) {
                documents = documents.filter(doc => doc.id !== id);
                await saveToCloud(documents);
            }
        }

        // Convert base64 saved PDF back into a downloadable document file
        function downloadPdf(id, title) {
            const targetDoc = documents.find(doc => doc.id === id);
            if (targetDoc && targetDoc.pdfData) {
                const byteCharacters = atob(targetDoc.pdfData);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: 'application/pdf' });
                const downloadUrl = URL.createObjectURL(blob);

                const link = document.createElement('a');
                link.href = downloadUrl;
                link.download = `${title}.pdf`;
                link.click();
                URL.revokeObjectURL(downloadUrl);
            } else {
                alert("Error retrieving saved PDF document.");
            }
        }

        // Render documents strictly sorted into their specific categories
        function renderDocuments() {
            const grid = document.getElementById('documentsGrid');
            const emptyState = document.getElementById('emptyState');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = documents.filter(doc => {
                const matchesCategory = currentFilter === 'All' || doc.category === currentFilter;
                const matchesSearch = doc.title.toLowerCase().includes(searchVal) || 
                                      doc.desc.toLowerCase().includes(searchVal) || 
                                      doc.category.toLowerCase().includes(searchVal);
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach(doc => {
                const categoryColors = getCategoryColors(doc.category);
                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200 rounded-2xl shadow-sm hover:shadow-md transition-all flex flex-col justify-between overflow-hidden group";

                const isPdf = doc.type === 'pdf';
                const actionButton = isPdf 
                    ? `<button onclick="downloadPdf('${doc.id}', '${doc.title}')" class="bg-white hover:bg-red-600 text-red-600 hover:text-white border border-red-100 hover:border-red-600 px-3.5 py-1.5 rounded-md font-bold transition flex items-center gap-1">
                         Download PDF <i class="fa-solid fa-file-pdf"></i>
                       </button>`
                    : `<a href="${doc.url}" target="_blank" rel="noopener noreferrer" class="bg-white hover:bg-pueo-600 text-pueo-700 hover:text-white border border-pueo-100 hover:border-pueo-600 px-3.5 py-1.5 rounded-md font-bold transition flex items-center gap-1">
                         Open Link <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                       </a>`;

                card.innerHTML = `
                    <div class="p-5">
                        <div class="flex justify-between items-start gap-2 mb-3">
                            <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ${categoryColors.badge}">
                                ${doc.category}
                            </span>
                            <button onclick="deleteDocument('${doc.id}')" class="text-slate-300 hover:text-rose-500 transition duration-150 p-1" title="Delete Document">
                                <i class="fa-solid fa-trash-can text-sm"></i>
                            </button>
                        </div>
                        <h3 class="font-bold text-slate-800 text-base mb-1.5 line-clamp-1 group-hover:text-pueo-700 transition flex items-center gap-1.5">
                            ${isPdf ? '<i class="fa-solid fa-file-pdf text-red-500"></i>' : '<i class="fa-solid fa-link text-sky-500"></i>'}
                            ${doc.title}
                        </h3>
                        <p class="text-xs text-slate-500 line-clamp-2 min-h-[2.5rem]">
                            ${doc.desc || 'No description provided.'}
                        </p>
                    </div>

                    <div class="bg-slate-50 px-5 py-3.5 border-t border-slate-100 flex justify-between items-center text-xs">
                        <span class="text-slate-400 font-medium">Added: ${doc.addedOn}</span>
                        ${actionButton}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function getCategoryColors(category) {
            switch(category) {
                case 'In processing': return { badge: 'bg-indigo-50 text-indigo-700 border border-indigo-100' };
                case 'MPA': return { badge: 'bg-emerald-50 text-emerald-700 border border-emerald-100' };
                case 'LES': return { badge: 'bg-amber-50 text-amber-700 border border-amber-100' };
                case 'operations': return { badge: 'bg-rose-50 text-rose-700 border border-rose-100' };
                default: return { badge: 'bg-slate-100 text-slate-700' };
            }
        }

        function filterCategory(category) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 px-4 py-2 rounded-full text-xs font-bold transition-all shrink-0";
            });

            // Handle spaces in "In processing" category button selection
            const sanitizedId = category.replace(/\s+/g, '-');
            const activeBtn = document.getElementById(`btn-${sanitizedId}`);
            if (activeBtn) {
                activeBtn.className = "filter-btn active bg-pueo-700 text-white px-4 py-2 rounded-full text-xs font-bold transition-all shadow-sm shrink-0";
            }
            renderDocuments();
        }

        function toggleInputFields() {
            const type = document.querySelector('input[name="docType"]:checked').value;
            const urlContainer = document.getElementById('urlInputContainer');
            const pdfContainer = document.getElementById('pdfInputContainer');
            if (type === 'link') {
                urlContainer.classList.remove('hidden');
                pdfContainer.classList.add('hidden');
            } else {
                urlContainer.classList.add('hidden');
                pdfContainer.classList.remove('hidden');
            }
        }

        function searchDocuments() { renderDocuments(); }
        function toggleSubmitPanel() { document.getElementById('submitPanel').classList.toggle('hidden'); }
        function clearForm() { document.getElementById('docForm').reset(); toggleInputFields(); }

        async function clearAllDocuments() {
            if (confirm('Warning: This will permanently wipe all uploaded links and PDF documents from the global system database. Continue?')) {
                documents = [];
                await saveToCloud(documents);
            }
        }
    </script>
</body>
</html>
