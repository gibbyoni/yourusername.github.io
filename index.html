<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUEO Wireless - Interactive Document Portal</title>
    <!-- Tailwind CSS for sleek UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pueo: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Header Section -->
    <header class="bg-gradient-to-r from-pueo-900 via-pueo-800 to-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-sky-500 p-2.5 rounded-lg shadow-inner">
                    <i class="fa-solid fa-wifi text-2xl text-white animate-pulse"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-wider uppercase">PUEO Wireless</h1>
                    <p class="text-xs text-sky-200">Interactive Document & Resource Portal</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleAdminPanel()" class="bg-sky-600 hover:bg-sky-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-all shadow-md flex items-center gap-2">
                    <i class="fa-solid fa-gears"></i> Plug & Play Panel
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- ADMIN PANEL (Plug and Play controls) -->
        <section id="adminPanel" class="hidden bg-white border border-sky-100 rounded-2xl shadow-lg p-6 mb-8 transition-all animate-fadeIn">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                <h2 class="text-lg font-bold text-pueo-900 flex items-center gap-2">
                    <i class="fa-solid fa-circle-plus text-sky-600"></i> Plug & Play: Add Document/PDF
                </h2>
                <button onclick="toggleAdminPanel()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="docForm" onsubmit="addDocument(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2 bg-slate-50 p-3 rounded-lg border border-slate-100 mb-2">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Document Delivery Method</label>
                    <div class="flex gap-6">
                        <label class="inline-flex items-center cursor-pointer">
                            <input type="radio" name="docType" value="link" checked onchange="toggleInputFields()" class="text-pueo-600 focus:ring-pueo-500 h-4 w-4">
                            <span class="ml-2 text-sm text-slate-700 font-medium">External Hyperlink</span>
                        </label>
                        <label class="inline-flex items-center cursor-pointer">
                            <input type="radio" name="docType" value="pdf" onchange="toggleInputFields()" class="text-pueo-600 focus:ring-pueo-500 h-4 w-4">
                            <span class="ml-2 text-sm text-slate-700 font-medium">Direct PDF Upload (Downloadable)</span>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Document Title</label>
                    <input type="text" id="docTitle" required placeholder="e.g., Q3 Network Status" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Category</label>
                    <select id="docCategory" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm">
                        <option value="In processing">In processing</option>
                        <option value="MPA">MPA</option>
                        <option value="LES">LES</option>
                        <option value="operations">operations</option>
                    </select>
                </div>

                <!-- Toggleable Source Input -->
                <div id="urlInputContainer" class="md:col-span-2">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Hyperlink / URL</label>
                    <input type="url" id="docUrl" placeholder="https://example.com/your-doc-link" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm">
                </div>

                <div id="pdfInputContainer" class="md:col-span-2 hidden">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Upload PDF File (Saved Securely in Browser DB)</label>
                    <input type="file" id="docFile" accept=".pdf" class="w-full px-3 py-1.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100">
                </div>

                <div class="md:col-span-2">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Short Description</label>
                    <input type="text" id="docDesc" placeholder="Brief details about this document..." class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm">
                </div>

                <div class="md:col-span-2 flex justify-end gap-3 mt-2">
                    <button type="button" onclick="clearForm()" class="px-4 py-2 border border-slate-200 text-slate-500 rounded-lg hover:bg-slate-50 transition text-sm font-medium">Clear Form</button>
                    <button type="submit" class="px-5 py-2 bg-pueo-700 hover:bg-pueo-800 text-white rounded-lg transition text-sm font-semibold shadow-sm">Plug In Document</button>
                </div>
            </form>

            <div class="mt-6 pt-4 border-t border-slate-100 flex flex-wrap justify-between items-center gap-3">
                <span class="text-xs text-slate-500">Advanced Portability:</span>
                <div class="flex gap-2">
                    <button onclick="exportJSON()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded flex items-center gap-1 transition">
                        <i class="fa-solid fa-file-export"></i> Export JSON Data
                    </button>
                    <button onclick="triggerImport()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded flex items-center gap-1 transition">
                        <i class="fa-solid fa-file-import"></i> Import JSON Data
                    </button>
                    <input type="file" id="importFile" class="hidden" accept=".json" onchange="importJSON(event)">
                    <button onclick="resetToDefault()" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold rounded flex items-center gap-1 transition">
                        <i class="fa-solid fa-arrow-rotate-left"></i> Reset Defaults
                    </button>
                </div>
            </div>
        </section>

        <!-- Search and Categorization Filters -->
        <section class="mb-8 flex flex-col lg:flex-row justify-between items-center gap-4">
            <!-- Dynamic Category Filter Pills -->
            <div class="flex flex-wrap gap-2 w-full lg:w-auto overflow-x-auto pb-1" id="filterContainer">
                <button onclick="filterCategory('All')" id="btn-All" class="filter-btn active bg-pueo-700 text-white px-4 py-2 rounded-full text-xs font-bold transition-all shadow-sm shrink-0">
                    All Documents
                </button>
                <button onclick="filterCategory('In processing')" id="btn-In-processing" class="filter-btn bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 px-4 py-2 rounded-full text-xs font-bold transition-all shrink-0">
                    In processing
                </button>
                <button onclick="filterCategory('MPA')" id="btn-MPA" class="filter-btn bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 px-4 py-2 rounded-full text-xs font-bold transition-all shrink-0">
                    MPA
                </button>
                <button onclick="filterCategory('LES')" id="btn-LES" class="filter-btn bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 px-4 py-2 rounded-full text-xs font-bold transition-all shrink-0">
                    LES
                </button>
                <button onclick="filterCategory('operations')" id="btn-operations" class="filter-btn bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 px-4 py-2 rounded-full text-xs font-bold transition-all shrink-0">
                    operations
                </button>
            </div>

            <!-- Search Bar -->
            <div class="relative w-full lg:w-80">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="searchInput" oninput="searchDocuments()" placeholder="Search documents..." class="w-full pl-9 pr-4 py-2.5 border border-slate-200 rounded-full focus:outline-none focus:ring-2 focus:ring-sky-500 bg-white text-sm shadow-inner">
            </div>
        </section>

        <!-- Dynamic Documents Grid -->
        <section>
            <div id="documentsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Javascript will render cards here -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden text-center py-16 bg-white border border-dashed border-slate-200 rounded-2xl">
                <i class="fa-regular fa-folder-open text-5xl text-slate-300 mb-3"></i>
                <h3 class="text-lg font-bold text-slate-600">No documents found</h3>
                <p class="text-slate-400 text-sm mt-1">Try adjusting searches, filters, or add a new document above.</p>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 text-xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <p>&copy; <span id="currentYear"></span> PUEO Wireless. All rights reserved.</p>
            <div class="flex gap-4">
                <span class="hover:text-slate-200 cursor-pointer">Security Protocol</span>
                <span class="hover:text-slate-200 cursor-pointer">Infrastructure Support</span>
                <span class="hover:text-slate-200 cursor-pointer">Admin Dashboard</span>
            </div>
        </div>
    </footer>

    <!-- App JavaScript Logic -->
    <script>
        // IndexedDB for large PDF persistence
        let db;
        const DB_NAME = "PUEOWirelessDB";
        const STORE_NAME = "pdfs";

        // Default documents configuration matching new categories
        const defaultDocuments = [
            {
                id: "1",
                title: "Network Architecture Blueprint",
                category: "In processing",
                type: "link",
                url: "https://example.com/network-blueprint",
                desc: "High-level diagram outlining the PUEO Wireless suburban node layout and fiber backhaul routing.",
                addedOn: "2023-10-15"
            },
            {
                id: "2",
                title: "Standard SLA Agreement",
                category: "LES",
                type: "link",
                url: "https://example.com/sla-agreement",
                desc: "Enterprise Client Service Level Agreement (SLA) covering latency limits and uptime guarantees.",
                addedOn: "2023-09-12"
            },
            {
                id: "3",
                title: "Field Deployment Checklist",
                category: "MPA",
                type: "link",
                url: "https://example.com/deployment-checklist",
                desc: "Step-by-step procedures for field technicians installing PUEO receiver dishes.",
                addedOn: "2023-11-02"
            },
            {
                id: "4",
                title: "Product Range Pitchdeck",
                category: "operations",
                type: "link",
                url: "https://example.com/marketing-pitch",
                desc: "Client-facing slide presentation showcasing our localized wireless bandwidth packages.",
                addedOn: "2023-11-20"
            }
        ];

        let documents = [];
        let currentFilter = 'All';

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('currentYear').innerText = new Date().getFullYear();
            initDatabase();
        });

        // Initialize IndexedDB
        function initDatabase() {
            const request = indexedDB.open(DB_NAME, 1);
            
            request.onerror = function(event) {
                console.error("IndexedDB initialization error:", event);
                loadDocumentsFromStorage();
            };
            
            request.onsuccess = function(event) {
                db = event.target.result;
                loadDocumentsFromStorage();
            };
            
            request.onupgradeneeded = function(event) {
                db = event.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME, { keyPath: "id" });
                }
            };
        }

        // Toggle source forms between Web Link and Local PDF
        function toggleInputFields() {
            const type = document.querySelector('input[name="docType"]:checked').value;
            const urlContainer = document.getElementById('urlInputContainer');
            const pdfContainer = document.getElementById('pdfInputContainer');
            
            if (type === 'link') {
                urlContainer.classList.remove('hidden');
                pdfContainer.classList.add('hidden');
                document.getElementById('docUrl').required = true;
                document.getElementById('docFile').required = false;
            } else {
                urlContainer.classList.add('hidden');
                pdfContainer.classList.remove('hidden');
                document.getElementById('docUrl').required = false;
                document.getElementById('docFile').required = true;
            }
        }

        // Load files metadata from localStorage and match DB files
        function loadDocumentsFromStorage() {
            const savedDocs = localStorage.getItem('pueo_documents_v2');
            if (savedDocs) {
                documents = JSON.parse(savedDocs);
            } else {
                documents = [...defaultDocuments];
                saveToLocalStorage();
            }
            renderDocuments();
        }

        // Toggle Admin section
        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            panel.classList.toggle('hidden');
        }

        // Save data helper (only contains document metadata; binary data goes to IndexedDB)
        function saveToLocalStorage() {
            localStorage.setItem('pueo_documents_v2', JSON.stringify(documents));
        }

        // Render Cards dynamically based on active filter and search terms
        function renderDocuments() {
            const grid = document.getElementById('documentsGrid');
            const emptyState = document.getElementById('emptyState');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = documents.filter(doc => {
                const matchesCategory = currentFilter === 'All' || doc.category === currentFilter;
                const matchesSearch = doc.title.toLowerCase().includes(searchVal) || 
                                      doc.desc.toLowerCase().includes(searchVal) || 
                                      doc.category.toLowerCase().includes(searchVal);
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach(doc => {
                const categoryColors = getCategoryColors(doc.category);
                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200 rounded-2xl shadow-sm hover:shadow-md transition-all flex flex-col justify-between overflow-hidden group";

                const isPdf = doc.type === 'pdf';
                const actionButton = isPdf 
                    ? `<button onclick="downloadPdf('${doc.id}', '${doc.title}')" class="bg-white hover:bg-red-600 text-red-600 hover:text-white border border-red-100 hover:border-red-600 px-3.5 py-1.5 rounded-md font-bold transition flex items-center gap-1">
                         Download PDF <i class="fa-solid fa-file-pdf"></i>
                       </button>`
                    : `<a href="${doc.url}" target="_blank" rel="noopener noreferrer" class="bg-white hover:bg-pueo-600 text-pueo-700 hover:text-white border border-pueo-100 hover:border-pueo-600 px-3.5 py-1.5 rounded-md font-bold transition flex items-center gap-1">
                         Open Doc <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                       </a>`;

                card.innerHTML = `
                    <div class="p-5">
                        <div class="flex justify-between items-start gap-2 mb-3">
                            <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ${categoryColors.badge}">
                                ${doc.category}
                            </span>
                            <button onclick="deleteDocument('${doc.id}')" class="text-slate-300 hover:text-rose-500 transition duration-150 p-1" title="Remove Document">
                                <i class="fa-solid fa-trash-can text-sm"></i>
                            </button>
                        </div>
                        <h3 class="font-bold text-slate-800 text-base mb-1.5 line-clamp-1 group-hover:text-pueo-700 transition flex items-center gap-1.5">
                            ${isPdf ? '<i class="fa-solid fa-file-pdf text-red-500"></i>' : '<i class="fa-solid fa-link text-sky-500"></i>'}
                            ${doc.title}
                        </h3>
                        <p class="text-xs text-slate-500 line-clamp-2 min-h-[2.5rem]">
                            ${doc.desc || 'No description provided.'}
                        </p>
                    </div>

                    <div class="bg-slate-50 px-5 py-3.5 border-t border-slate-100 flex justify-between items-center text-xs">
                        <span class="text-slate-400 font-medium">Added: ${doc.addedOn}</span>
                        ${actionButton}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Get matching CSS colors for categories
        function getCategoryColors(category) {
            switch(category) {
                case 'In processing': return { badge: 'bg-indigo-50 text-indigo-700 border border-indigo-100' };
                case 'MPA': return { badge: 'bg-emerald-50 text-emerald-700 border border-emerald-100' };
                case 'LES': return { badge: 'bg-amber-50 text-amber-700 border border-amber-100' };
                case 'operations': return { badge: 'bg-rose-50 text-rose-700 border border-rose-100' };
                default: return { badge: 'bg-slate-100 text-slate-700' };
            }
        }

        // Handle addition of standard hyperlink or direct PDF uploads
        function addDocument(e) {
            e.preventDefault();
            const id = Date.now().toString();
            const title = document.getElementById('docTitle').value.trim();
            const category = document.getElementById('docCategory').value;
            const desc = document.getElementById('docDesc').value.trim();
            const addedOn = new Date().toISOString().split('T')[0];
            const type = document.querySelector('input[name="docType"]:checked').value;

            if (type === 'pdf') {
                const fileInput = document.getElementById('docFile');
                if (fileInput.files.length === 0) {
                    alert("Please select a PDF file!");
                    return;
                }
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(event) {
                    const arrayBuffer = event.target.result;
                    // Store file in IndexedDB
                    savePdfToDB(id, arrayBuffer, file.name, function() {
                        documents.unshift({ id, title, category, type: 'pdf', desc, addedOn });
                        saveToLocalStorage();
                        renderDocuments();
                        clearForm();
                        alert('PDF uploaded and saved locally!');
                    });
                };
                reader.readAsArrayBuffer(file);
            } else {
                const url = document.getElementById('docUrl').value.trim();
                documents.unshift({ id, title, category, type: 'link', url, desc, addedOn });
                saveToLocalStorage();
                renderDocuments();
                clearForm();
                alert('Document link successfully created!');
            }
        }

        // Save binary file into IndexedDB
        function savePdfToDB(id, arrayBuffer, fileName, callback) {
            if (!db) {
                alert("Database connection is not ready. Try again.");
                return;
            }
            const transaction = db.transaction([STORE_NAME], "readwrite");
            const store = transaction.objectStore(STORE_NAME);
            const data = { id: id, data: arrayBuffer, name: fileName };
            const request = store.put(data);
            
            request.onsuccess = function() {
                callback();
            };
            request.onerror = function(event) {
                console.error("IndexedDB store error:", event);
            };
        }

        // Retrieve and trigger immediate download of binary PDF file
        function downloadPdf(id, title) {
            if (!db) {
                alert("Local storage database not connected.");
                return;
            }
            const transaction = db.transaction([STORE_NAME], "readonly");
            const store = transaction.objectStore(STORE_NAME);
            const request = store.get(id);

            request.onsuccess = function(event) {
                const record = event.target.result;
                if (record && record.data) {
                    const blob = new Blob([record.data], { type: 'application/pdf' });
                    const downloadUrl = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = downloadUrl;
                    link.download = record.name || `${title}.pdf`;
                    link.click();
                    URL.revokeObjectURL(downloadUrl);
                } else {
                    alert("PDF data could not be located in browser storage.");
                }
            };
        }

        // Clear Form fields
        function clearForm() {
            document.getElementById('docForm').reset();
            toggleInputFields();
        }

        // Delete document link and IndexedDB entry
        function deleteDocument(id) {
            if (confirm('Are you sure you want to remove this document?')) {
                const target = documents.find(doc => doc.id === id);
                if (target && target.type === 'pdf' && db) {
                    const transaction = db.transaction([STORE_NAME], "readwrite");
                    const store = transaction.objectStore(STORE_NAME);
                    store.delete(id);
                }
                documents = documents.filter(doc => doc.id !== id);
                saveToLocalStorage();
                renderDocuments();
            }
        }

        // Filter Category actions
        function filterCategory(category) {
            currentFilter = category;

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 px-4 py-2 rounded-full text-xs font-bold transition-all shrink-0";
            });

            // Handle spacing in category element IDs
            const sanitizedId = category.replace(/\s+/g, '-');
            const activeBtn = document.getElementById(`btn-${sanitizedId}`);
            if (activeBtn) {
                activeBtn.className = "filter-btn active bg-pueo-700 text-white px-4 py-2 rounded-full text-xs font-bold transition-all shadow-sm shrink-0";
            }

            renderDocuments();
        }

        // Search action
        function searchDocuments() {
            renderDocuments();
        }

        // Export data feature (metadata backup)
        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(documents, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "pueo_wireless_portal_data.json");
            dlAnchorElem.click();
        }

        // Trigger Hidden File Upload
        function triggerImport() {
            document.getElementById('importFile').click();
        }

        // Import data feature (metadata backup)
        function importJSON(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(fileLoadedEvent) {
                try {
                    const parsedData = JSON.parse(fileLoadedEvent.target.result);
                    if (Array.isArray(parsedData)) {
                        documents = parsedData;
                        saveToLocalStorage();
                        renderDocuments();
                        alert('Portal database structured imported successfully!');
                    } else {
                        alert('Invalid data format. Expected an array of documents.');
                    }
                } catch (e) {
                    alert('Error parsing JSON file. Please ensure it is a valid backup.');
                }
            };
            fileReader.readAsText(event.target.files[0], "UTF-8");
        }

        // Reset to Defaults
        function resetToDefault() {
            if (confirm('This will wipe all custom entries and restore defaults. Continue?')) {
                if (db) {
                    const transaction = db.transaction([STORE_NAME], "readwrite");
                    const store = transaction.objectStore(STORE_NAME);
                    store.clear();
                }
                documents = [...defaultDocuments];
                saveToLocalStorage();
                renderDocuments();
            }
        }
    </script>
</body>
</html>
