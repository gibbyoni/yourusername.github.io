  <style>
    /* CSS Custom Variables for Theme Engine */
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --accent-color: #0000ee;
      --visited-color: #551a8b;
      --border-color: #000000;
      --card-bg: #ffffff;
      --header-bg: #f0f0f0;
      --highlight-bg: #ffffcc;
      --font-stack: Arial, sans-serif;
    }

    /* Dark Theme */
    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --accent-color: #33b5e5;
      --visited-color: #9933cc;
      --border-color: #444444;
      --card-bg: #1e1e1e;
      --header-bg: #1a1a1a;
      --highlight-bg: #332200;
    }

    /* Tactical Red (Night Vision Friendly) */
    [data-theme="red"] {
      --bg-color: #000000;
      --text-color: #ff0000;
      --accent-color: #ff3333;
      --visited-color: #aa0000;
      --border-color: #ff0000;
      --card-bg: #000000;
      --header-bg: #110000;
      --highlight-bg: #440000;
    }

    /* Terminal Green */
    [data-theme="green"] {
      --bg-color: #050b05;
      --text-color: #00ff00;
      --accent-color: #39ff14;
      --visited-color: #008f11;
      --border-color: #00ff00;
      --card-bg: #050b05;
      --header-bg: #0c180c;
      --highlight-bg: #003300;
      --font-stack: 'Courier New', Courier, monospace;
    }

    /* Base Styling */
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-stack);
      margin: 0;
      padding: 15px;
      line-height: 1.3;
    }

    header {
      background-color: var(--header-bg);
      border: 1px solid var(--border-color);
      padding: 15px;
      margin-bottom: 15px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand h1 {
      margin: 0;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .brand p {
      margin: 2px 0 0 0;
      font-size: 12px;
      opacity: 0.8;
    }

    /* Clock Hud */
    .hud-clocks {
      display: flex;
      gap: 15px;
      font-family: monospace;
      font-size: 16px;
      font-weight: bold;
      border: 1px dashed var(--border-color);
      padding: 5px 10px;
      background: var(--card-bg);
    }

    .clock-item span {
      color: var(--accent-color);
    }

    /* Control Panel (Search + Theme + Bookmarks) */
    .control-panel {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }

    .search-container {
      flex-grow: 1;
      max-width: 400px;
    }

    .search-input {
      width: 100%;
      padding: 6px;
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      font-size: 14px;
    }

    .theme-buttons button {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 5px 10px;
      cursor: pointer;
      font-size: 12px;
    }

    .theme-buttons button:hover {
      background-color: var(--highlight-bg);
    }

    /* Link Portal Columns Grid */
    .portal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .column {
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      padding: 10px;
    }

    .column-title {
      font-weight: bold;
      text-transform: uppercase;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 4px;
      margin-bottom: 8px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
    }

    .link-list {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    .link-list li {
      margin-bottom: 5px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .link-list a {
      color: var(--accent-color);
      text-decoration: underline;
    }

    .link-list a:visited {
      color: var(--visited-color);
    }

    .add-bookmark-form {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-color);
    }

      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 4px;
      font-size: 11px;
    }
